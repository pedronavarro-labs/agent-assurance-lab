name: Agent Assurance CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run passing static check
        run: |
          agent-assurance \
            --approved examples/approved.json \
            --observed examples/observed_pass.json \
            --format text

  assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Agent Assurance
        uses: ./
        with:
          approved: examples/approved.json
          observed: examples/observed_pass.json
          policy: examples/policy.yml
          session: examples/session.json
          report: agent-assurance.sarif
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agent-assurance.sarif

  negative-controls:
    name: Verify expected detections
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Static drift must fail
        shell: bash
        run: |
          if agent-assurance \
            --approved examples/approved.json \
            --observed examples/observed.json \
            --policy examples/policy.yml \
            --format text; then
            echo "Expected the drift fixture to fail"
            exit 1
          fi
      - name: Runtime effect violation must fail
        shell: bash
        run: |
          if agent-assurance \
            --approved examples/approved.json \
            --observed examples/observed_pass.json \
            --session examples/session.json \
            --format text; then
            echo "Expected the runtime-effect fixture to fail"
            exit 1
          fi
